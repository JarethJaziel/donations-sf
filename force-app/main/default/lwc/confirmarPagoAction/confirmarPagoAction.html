<template>
    <lightning-quick-action-panel title="Confirmar Pago Manual (Tesorería)">
        <template if:true={cargando}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Cargando información..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={cargando}>
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </template>

            <template if:true={donacion}>
                <template if:true={yaPagada}>
                    <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert">
                        <span class="slds-assistive-text">Aviso</span>
                        <h2>Esta donación ya se encuentra registrada como Pagada. No se requieren acciones adicionales.</h2>
                    </div>
                </template>

                <div class="slds-form slds-form_stacked">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Folio</span>
                            <div class="slds-form-element__control">
                                <strong>{donacion.folio}</strong>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Campaña</span>
                            <div class="slds-form-element__control">
                                <strong>{donacion.campanaNombre}</strong>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Monto</span>
                            <div class="slds-form-element__control">
                                <lightning-formatted-number value={donacion.monto} format-style="currency" currency-code="MXN"></lightning-formatted-number>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Modalidad</span>
                            <div class="slds-form-element__control">
                                <span>{donacion.modalidad}</span>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Nombre del Donante / Razón Social</span>
                            <div class="slds-form-element__control">
                                <span>{nombreDonanteMostrado}</span>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <span class="slds-form-element__label">Estado Actual</span>
                            <div class="slds-form-element__control">
                                <lightning-badge label={donacion.estado}></lightning-badge>
                            </div>
                        </div>
                    </div>
                </div>

                <template if:false={yaPagada}>
                    <div class="slds-box slds-theme_shade slds-m-top_small">
                        <p class="slds-text-body_small">
                            Al confirmar este pago manual, la donación cambiará inmediatamente a estado <strong>Pagada</strong>,
                            se sumará a la recaudación de la campaña y se enviará automáticamente el comprobante personalizado por correo.
                        </p>
                    </div>
                </template>
            </template>
        </template>

        <div slot="footer">
            <lightning-button
                variant="neutral"
                label="Cancelar"
                onclick={cerrarModal}
                disabled={procesando}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Confirmar Pago y Enviar Comprobante"
                class="slds-m-left_x-small"
                onclick={ejecutarConfirmacion}
                disabled={botonConfirmarDeshabilitado}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
